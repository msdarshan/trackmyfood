<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackMyFood">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>TrackMyFood</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0f0e0d;--card:#1b1917;--card2:#25221f;--ink:#f3efe9;--mute:#a19a90;--line:#302c28;
  --acc:#f08a3c;--acc2:#3a2616;--pro:#6f9bff;--carb:#f2c14e;--fat:#ff7a93;--fib:#5fcf8a;
  --bad:#ff6b57;--r:16px;--sh:0 1px 0 rgba(255,255,255,.03) inset;
}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{font-size:16px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header.top{display:flex;align-items:center;gap:8px;padding:12px 0 6px}
header.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--fib)}.dot.err{background:var(--bad)}.dot.busy{background:var(--carb)}
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:4px;box-shadow:var(--sh);margin:6px 0 12px}
.datebar button{width:44px;height:40px;border-radius:12px;font-size:20px}
.datebar b{font-size:15px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.summary{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.ringbox{position:relative;width:128px;height:128px}
.ring{width:128px;height:128px}
.ring-bg{fill:none;stroke:var(--line);stroke-width:11}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring-fg.over{stroke:var(--bad)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-size:26px;line-height:1}.ringtxt span{font-size:12px;color:var(--mute)}
.bars{display:grid;gap:9px}
.bar .lab{display:flex;justify-content:space-between;font-size:13px}
.bar .lab span{color:var(--mute)}
.track{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:6px}
.linkbtn{color:var(--acc);font-weight:600;font-size:14px;padding:8px 0}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h .ic{width:36px;height:36px;border-radius:10px;background:var(--acc2);display:grid;place-items:center;flex:none}
.meal-h .ic svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meal-h .t{flex:1}
.meal-h .t b{display:block;font-size:16px}
.meal-h .t small{color:var(--mute);font-size:12.5px}
.meal-h .kc{font-weight:700;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.items{margin-top:8px;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .nm{flex:1}
.item .nm small{display:block;color:var(--mute);font-size:12.5px}
.item .kc{font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--acc2);color:var(--acc);vertical-align:1px;margin-left:4px}
.badge.ai{background:#1c2740;color:var(--pro)}.badge.low{background:#3d1d19;color:var(--bad)}.badge.ok{background:#173323;color:var(--fib)}
.mealacts{display:flex;gap:8px;margin-top:10px}
.mealacts button{flex:1;height:40px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.mealacts svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0;min-height:48px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .fab{flex:none;width:56px;height:56px;margin-top:-22px;border-radius:50%;background:var(--acc);color:#1a0f06;box-shadow:0 6px 18px rgba(240,138,60,.35);justify-content:center}
nav.tabs .fab svg{width:28px;height:28px}
.overlay{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:calc(var(--vvh,100vh) - 12px - env(safe-area-inset-top));overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.overlay{animation:none}}
.sheet-h{display:flex;align-items:center;gap:8px;margin:-14px -16px 12px;padding:14px 16px 10px;position:sticky;top:-14px;background:var(--card);z-index:3}
.kb .sheet-h,.sheet.tall .sheet-h{margin-top:0;top:0;padding-top:0}
.sheet-h b{flex:1;font-size:18px}
.list .row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .row .nm{flex:1}.list .row small{display:block;color:var(--mute);font-size:12.5px}
.sec{font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;background:var(--acc);color:#1a0f06;font-weight:700;margin-top:12px}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;flex:none}
.qty input{text-align:center;font-weight:700}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.nut div{background:var(--card2);border-radius:12px;padding:8px 6px;text-align:center}
.nut b{display:block;font-size:17px}.nut span{font-size:11.5px;color:var(--mute)}
table.micro{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.micro td{padding:7px 2px;border-bottom:1px solid var(--line)}
table.micro td:nth-child(2){text-align:right;white-space:nowrap}
table.micro td:nth-child(3){width:38%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;height:38px;padding:0 12px;border-radius:20px;background:var(--card2);font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:#1a0f06}
.switch{display:flex;align-items:center;gap:10px;padding:10px 0}
.switch input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.rev{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.rev .top{display:flex;gap:8px;align-items:center}
.rev .meta{font-size:12.5px;color:var(--mute);margin-top:6px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.chart{width:100%;height:180px;display:block}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--sh)}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
h2{font-size:18px;margin:14px 0 8px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat div{text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mute)}
code{font-size:13px;overflow-wrap:anywhere}
.qbadge{position:absolute;top:2px;margin-left:16px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px}
nav.tabs button{position:relative}
.banner{display:flex;align-items:center;gap:10px;background:var(--acc2);border:1px solid #5a3a20;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;cursor:pointer}
.banner b{flex:1;color:var(--acc)}
.sch{display:flex;gap:12px;align-items:flex-start}
.sch .tm{font-size:22px;font-weight:800;min-width:62px;line-height:1.1;font-variant-numeric:tabular-nums}
.sch .tm small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.sch .bd{flex:1}
.sch .bd b{display:block}
.sch .bd small{color:var(--mute);font-size:13px}
.logbtn{min-width:84px;height:44px;border-radius:12px;background:var(--acc);color:#1a0f06;font-weight:700;font-size:14px;flex:none}
.logbtn.done{background:var(--card2);color:var(--fib)}
.pend{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}
.pend .bd{flex:1}.pend .bd small{display:block;color:var(--mute);font-size:12.5px}
.pend button{height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14px}
.pend .yes{background:var(--acc);color:#1a0f06}.pend .no{background:var(--card2);color:var(--mute)}
header.top .iconbtn{background:var(--card)}
.airow .nm{color:var(--acc)}.airow svg.sp{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2;vertical-align:-3px;margin-right:4px}
.mealacts button{min-width:0}
.overlay.top{align-items:flex-start}
.kb .overlay{align-items:flex-start}
.kb .sheet{border-radius:0 0 20px 20px;max-height:var(--vvh,100vh);padding-top:calc(10px + env(safe-area-inset-top))}
.sheet.tall{height:var(--vvh,100vh);max-height:none;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top));animation:fade .15s}
.sheet.tall .sheet-h,.sheet.tall>input,.sheet.tall>.mealacts{flex:none}
.sheet.tall #res{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:8px -16px 0;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.kb .sheet{padding-bottom:12px}.kb .sheet.tall #res{padding-bottom:12px}
.qty button.chip{width:auto;font-size:14px;padding:0 14px;flex:none;white-space:nowrap}
.card>#planbox .plan{background:none;padding:0;margin-top:0}
.set-sec{font-size:13px;font-weight:700;color:var(--mute);margin:18px 4px 8px}
.set-group{padding:4px 0}
.set-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-ic{width:34px;height:34px;border-radius:10px;background:var(--acc2);display:grid;place-items:center;flex:none}
.set-ic svg{width:18px;height:18px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-t{flex:1;min-width:0}.set-t b{display:block;font-size:15.5px}.set-t small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute);font-size:22px;line-height:1}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:6px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#1a0f06;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.subhead{gap:6px}.subhead h1{font-size:20px}.subhead .iconbtn{background:var(--card);margin-left:-4px}
.subhead .iconbtn svg{width:22px;height:22px}
.steps{padding-left:20px;margin:10px 0 0;color:var(--mute);font-size:14px}.steps li{margin:6px 0}
details.adv summary{cursor:pointer;list-style:none}details.adv summary::-webkit-details-marker{display:none}details.adv summary b::after{content:' ›';color:var(--mute)}
.bar,.ringbox{cursor:pointer}
.chev.sm{font-size:15px;color:var(--mute);font-weight:400}
table.micro.tap tr{cursor:pointer}
.bd-head{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}.bd-head b{font-size:28px}.bd-head span{color:var(--mute);font-size:14px}
.bd-row{padding:9px 0;border-bottom:1px solid var(--line)}
.bd-top{display:flex;align-items:baseline;gap:8px}.bd-n{flex:1;min-width:0}.bd-n small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-top b{white-space:nowrap;font-size:14.5px}.bd-p{width:42px;text-align:right;color:var(--mute);font-size:13px}
.bd-row .track{margin-top:6px;height:5px}
.kc .tk{color:var(--mute);font-weight:500}
.track.mt{margin-top:8px;height:5px}
.plan{background:var(--card2);border-radius:14px;padding:12px;margin-top:12px}
.pl-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.pl-row span{color:var(--mute)}
.pl-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin:10px 0 6px}
.pl-big b{display:block;font-size:18px}.pl-big span{font-size:11.5px;color:var(--mute)}
.split-row{display:flex;align-items:center;gap:10px;padding:6px 0}.split-row span{flex:1;font-size:14px}.split-row b{width:80px;text-align:right;font-size:14px;white-space:nowrap}
.split-row .qty input{padding:8px;text-align:center}.split-row small{color:var(--mute)}
.grid3 small.hint{display:block;margin-top:2px}
.who{font-size:12px;color:var(--mute);margin-right:4px;white-space:nowrap}
.viewbar{display:flex;align-items:center;gap:10px;background:#1c2740;border:1px solid #2d3e63;border-radius:var(--r);padding:10px 12px;margin:12px 0 10px}
.viewbar>svg{width:22px;height:22px;stroke:var(--pro);fill:none;stroke-width:2;flex:none}
.viewbar div{flex:1}.viewbar b{display:block}.viewbar small{color:var(--mute);font-size:12.5px}
.banner svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.banner svg{stroke:var(--acc)}
.sch .bd small{display:block;line-height:1.4;margin-top:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="upIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json" hidden>
<script src="foods.js"></script>
<script>
{
'use strict';
/* ---------- constants ---------- */
const NK=['kcal','pro','carb','fat','fib','sug','sfat','na','k','ca','fe','vc','va','vd','b12'];
const NM={kcal:['Calories','kcal'],pro:['Protein','g'],carb:['Carbs','g'],fat:['Fat','g'],fib:['Fibre','g'],sug:['Sugar','g'],sfat:['Saturated fat','g'],na:['Sodium','mg'],k:['Potassium','mg'],ca:['Calcium','mg'],fe:['Iron','mg'],vc:['Vitamin C','mg'],va:['Vitamin A','mcg'],vd:['Vitamin D','mcg'],b12:['Vitamin B12','mcg']};
const LIMITS=new Set(['sug','sfat','na']); // "stay under" nutrients
const DEF_T={kcal:2000,pro:90,carb:250,fat:65,fib:30,sug:50,sfat:20,na:2000,k:3500,ca:1000,fe:19,vc:80,va:1000,vd:15,b12:2.2};

function searchFoods(q){

/* ---------- body profile, calorie & protein plan, meal split ---------- */
const DEF_PROFILE={sex:'male',age:'',heightCm:'',activity:1.375,goal:'maintain',proteinPerKg:1.2,auto:true};
const DEF_SPLIT={breakfast:25,msnack:10,lunch:30,esnack:10,dinner:25};

const weightList=()=>Object.values(D().weights||{}).filter(w=>!w.deleted&&+w.kg>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const latestKg=()=>{const l=weightList();return l.length?+l[l.length-1].kg:0};
const GOALS={lose2:['Lose 0.5 kg a week',-0.5],lose1:['Lose 0.25 kg a week',-0.25],maintain:['Stay at this weight',0],gain1:['Gain 0.25 kg a week',0.25],gain2:['Gain 0.5 kg a week',0.5]};
const ACTS=[[1.2,'Sedentary: desk job, little exercise'],[1.375,'Lightly active: workouts 1–3 days a week'],[1.55,'Moderately active: workouts 3–5 days a week'],[1.725,'Very active: hard exercise 6–7 days a week'],[1.9,'Athlete or heavy physical work']];
const PROTS=[[0.8,'0.8 g/kg: minimum for health (ICMR)'],[1.2,'1.2 g/kg: active adult'],[1.6,'1.6 g/kg: strength training or fat loss'],[2.0,'2.0 g/kg: high, for serious lifting']];
// Mifflin-St Jeor BMR x activity, +/- 7700 kcal per kg of weight change, never below BMR or 1200/1500 kcal.
function calcPlan(p,kg){
  const h=+p.heightCm,a=+p.age;if(!kg||!h||!a)return null;
  const bmr=10*kg+6.25*h-5*a+(p.sex==='female'?-161:5),tdee=bmr*(+p.activity||1.375);
  const rate=(GOALS[p.goal]||GOALS.maintain)[1];
  let kcal=tdee+rate*7700/7;const floor=Math.max(bmr,p.sex==='female'?1200:1500),floored=kcal<floor;
  kcal=Math.round(Math.max(kcal,floor)/10)*10;
  const pro=Math.round((+p.proteinPerKg||1.2)*kg),fat=Math.round(kcal*0.25/9),carb=Math.max(0,Math.round((kcal-pro*4-fat*9)/4)),fib=Math.round(kcal/1000*14);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,pro,fat,carb,fib,bmi:kg/((h/100)**2),floored};
}
// BMI bands for Asian Indians (lower cut-offs than the WHO global ones).
const bmiLabel=b=>b<18.5?['Underweight','var(--carb)']:b<23?['Healthy','var(--fib)']:b<25?['Overweight','var(--carb)']:['Obese','var(--bad)'];
function applyPlan(quiet){
  const pl=calcPlan(profile(),latestKg());if(!pl){if(!quiet)toast('Add your age, height and weight first');return false}
  Object.assign(S.settings.targets,{kcal:pl.kcal,pro:pl.pro,carb:pl.carb,fat:pl.fat,fib:pl.fib});put('settings',S.settings);
  if(!quiet)toast(`Targets set: ${pl.kcal} kcal, ${pl.pro} g protein`);return true;
}

/* ---------- scheduled meals: ask before logging ---------- */
const schId=(r,d,i)=>`sch_${r.id}_${d}_${i}`;
const schState=(r,d)=>{const e=S.entries[schId(r,d,0)]||S.entries[`auto_${r.id}_${d}_0`];return !e?'':e.deleted?'skipped':'logged'};
const activeRules=()=>Object.values(S.rules).filter(r=>!r.deleted).sort((a,b)=>toMin(a.time)-toMin(b.time));
const ruleKcal=r=>Math.round(sumN(r.items.map(i=>({n:scaleN(i.p100,i.grams)}))).kcal);
const runsOn=(r,d)=>r.days.includes(parseYmd(d).getDay())&&d>=(r.startDate||'0');
function pendingList(){
  const t=today(),hm=toMin(nowTime()),out=[];
  activeRules().forEach(r=>{
    if(!r.active)return;
    [addDays(t,-1),t].forEach(d=>{
      if(!runsOn(r,d)||(d===t&&hm<toMin(r.time))||schState(r,d))return;
      out.push({r,d});
    });
  });
  return out;
}
function decide(r,d,ok){
  r.items.forEach((it,i)=>{const e=makeEntry(it,d,r.slot,'scheduled',r.id,schId(r,d,i));e.createdAt=Date.now();e.deleted=!ok;put('entry',e,true)});
  save();scheduleSync();
}

async function api(payload){
  if(!S.cfg.scriptUrl)throw new Error('This app is not connected yet. Go to Settings (gear icon) and paste your setup link.');
  const res=await fetch(S.cfg.scriptUrl,{method:'POST',body:JSON.stringify({...payload,token:S.cfg.token})});
  let j;try{j=await res.json()}catch(e){throw new Error('Unexpected reply from Apps Script — check the deployment URL and access ("Anyone")')}
  if(!j.ok)throw new Error(j.error||'Request failed');return j;
}
let syncTimer=null,syncing=false;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),1500)}
async function syncNow(pull){
  if(!S.cfg.scriptUrl||syncing)return;syncing=true;setSync('busy');
  try{
    if(S.queue.length){const ops=S.queue.slice(0,200);await api({action:'push',ops});S.queue=S.queue.filter(o=>!ops.includes(o));if(S.queue.length)setTimeout(()=>syncNow(false),100)}
    if(pull){const j=await api({action:'pull',from:addDays(today(),-90)});merge(j)}
    S.lastSync=Date.now();save();setSync('ok');
  }catch(e){setSync('err',e.message)}
  finally{syncing=false}
}
function merge(j){
  if(j.me){S.me=j.me;save()}
  const pend=new Set(S.queue.map(o=>o.kind+':'+o.rec.id));let ch=false;
  const m=(kind,arr)=>(arr||[]).forEach(r=>{if(!r||!r.id||pend.has(kind+':'+r.id))return;const c=S[COLL[kind]],l=c[r.id];if(!l||(+r.updatedAt||0)>(+l.updatedAt||0)){c[r.id]=r;ch=true}});
  m('entry',j.entries);m('meal',j.meals);m('rule',j.rules);m('food',j.foods);m('weight',j.weights);
  if(j.settings&&!pend.has('settings:settings')&&(+j.settings.updatedAt||0)>(+S.settings.updatedAt||0)){S.settings=j.settings;S.settings.targets={...DEF_T,...S.settings.targets};ch=true}
  if(ch){save();render()}
}

function syncHtml(){

}

async function fileToJpeg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that image'));i.src=url});
    const max=1280,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.85);
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- keyboard-aware layout: keep sheets inside the visible area when the iOS keyboard is up ---------- */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const set=()=>{const r=document.documentElement;r.style.setProperty('--vvh',vv.height+'px');r.style.setProperty('--vvt',vv.offsetTop+'px');
    const a=document.activeElement,typing=a&&a.matches&&a.matches('input:not([type=file]):not([type=checkbox]),textarea');
    r.classList.toggle('kb',!!typing&&window.innerHeight-vv.height>120)};
  document.addEventListener('focusout',()=>setTimeout(set,50));
  vv.addEventListener('resize',set);vv.addEventListener('scroll',set);set();
  window.addEventListener('scroll',()=>{if(stack.length&&window.scrollY!==0)window.scrollTo(0,0)},{passive:true});
  document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select')&&e.target.closest('.sheet'))setTimeout(()=>e.target.scrollIntoView({block:'nearest'}),250)});

  ov.innerHTML=`<div class="sheet${opts&&opts.tall?' tall':''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeSheet()});
  document.body.appendChild(ov);const sh=$('.sheet',ov);sh._o=opts||{};stack.push(ov);return sh;
}

function lockBody(on){

  else if(b.style.position==='fixed'){b.style.position='';b.style.top='';b.style.left='';b.style.right='';b.style.overflow='';window.scrollTo(0,lockedY)}
}

function weightCard(){
  const wl=weightList(),p=profile(),kg=latestKg(),RO=!!U.view;
  if(!wl.length)return `<div class="card"><b>Weight</b><div class="empty">No weight logged yet. Log it regularly, at the same time of day, to see your trend.</div>${RO?'':`<button class="btn" data-act="logWeight">${svg(I.plus)} Log weight</button>`}</div>`;

  const bmi=+p.heightCm?kg/((p.heightCm/100)**2):0,bl=bmi?bmiLabel(bmi):null;
  const pts=wl.filter(w=>w.date>=addDays(today(),-90));const W=340,H=110;
  let chart='';
  if(pts.length>1){const mn=Math.min(...pts.map(w=>+w.kg))-0.5,mx=Math.max(...pts.map(w=>+w.kg))+0.5,t0=parseYmd(pts[0].date).getTime(),t1=parseYmd(pts[pts.length-1].date).getTime()||t0+1;
    const xy=w=>[8+(W-16)*((parseYmd(w.date).getTime()-t0)/Math.max(1,t1-t0)),8+(H-24)*(1-(w.kg-mn)/(mx-mn))];
    chart=`<svg class="chart" style="height:120px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(w=>xy(w).join(',')).join(' ')}"/>${pts.map(w=>`<circle cx="${xy(w)[0]}" cy="${xy(w)[1]}" r="3" fill="var(--acc)"/>`).join('')}<text x="4" y="${H-2}" font-size="10" fill="var(--mute)">${esc(parseYmd(pts[0].date).toLocaleDateString(undefined,{day:'numeric',month:'short'}))}</text><text x="${W-4}" y="${H-2}" font-size="10" text-anchor="end" fill="var(--mute)">${esc(parseYmd(last.date).toLocaleDateString(undefined,{day:'numeric',month:'short'}))}</text></svg>`}
  return `<div class="card"><div class="meal-h"><div class="t"><b>Weight</b><small>Last logged ${prettyDate(last.date)}</small></div>${RO?'':`<button class="chip" data-act="logWeight">+ Log</button>`}</div>
    <div class="stat" style="margin-top:10px;grid-template-columns:repeat(3,minmax(0,1fr))"><div><b>${r1(kg)} kg</b><span>Now</span></div><div><b style="color:${diff>0?'var(--carb)':diff<0?'var(--fib)':'var(--ink)'}">${diff>0?'+':''}${diff} kg</b><span>since ${prettyDate(ref.date)}</span></div><div><b style="color:${bl?bl[1]:'var(--mute)'}">${bmi?r1(bmi):'–'}</b><span>BMI${bl?' · '+bl[0]:''}</span></div></div>
    ${chart}${RO?'':`<button class="linkbtn" data-act="weightHistory">History ›</button>`}</div>`;
}
function viewTrends(){
  const n=U.trend,t=targets(),days=[];
  for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);days.push([d,sumN(dayEntries(d))])}
  const logged=days.filter(d=>d[1].kcal>0),avg=zeroN();
  logged.forEach(d=>NK.forEach(k=>avg[k]+=d[1][k]/logged.length));
  const W=340,H=170,pb=20,max=Math.max(t.kcal*1.25,...days.map(d=>d[1].kcal)),bw=(W-10)/n;
  const y=v=>H-pb-(v/max)*(H-pb-10);
  const bars=days.map(([d,v],i)=>{const x=5+i*bw+bw*.15,h=Math.max(0,H-pb-y(v.kcal));return `<rect x="${x}" y="${y(v.kcal)}" width="${bw*.7}" height="${h}" rx="3" fill="${v.kcal>t.kcal?'var(--bad)':'var(--acc)'}" opacity="${v.kcal?1:.2}"/>`+(n<=7||i%5===0?`<text x="${x+bw*.35}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--mute)">${n<=7?parseYmd(d).toLocaleDateString(undefined,{weekday:'short'}):parseYmd(d).getDate()}</text>`:'')}).join('');
  return weightCard()+`<div class="seg" style="margin:6px 0 12px"><button class="${n===7?'on':''}" data-act="trend" data-n="7">7 days</button><button class="${n===30?'on':''}" data-act="trend" data-n="30">30 days</button></div>
  <div class="card"><b>Calories per day</b><div class="hint">Line shows your ${t.kcal} kcal target</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}<line x1="0" x2="${W}" y1="${y(t.kcal)}" y2="${y(t.kcal)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1"/></svg></div>
  <div class="card"><b>Daily average</b> <span class="hint">over ${logged.length} logged day${logged.length===1?'':'s'}</span>
  ${logged.length?`<div class="stat" style="margin-top:10px"><div><b>${Math.round(avg.kcal)}</b><span>kcal</span></div><div><b style="color:var(--pro)">${r1(avg.pro)}g</b><span>Protein</span></div><div><b style="color:var(--carb)">${r1(avg.carb)}g</b><span>Carbs</span></div><div><b style="color:var(--fat)">${r1(avg.fat)}g</b><span>Fat</span></div></div>${microTable(avg,t)}`:'<div class="empty">No meals logged in this period yet.</div>'}</div>`;
}

/* ---------- nutrient breakdown: which meals and foods contributed ---------- */
function openBreakdown(k){
  const es=dayEntries(U.date),tot=sumN(es)[k]||0,tg=targets()[k]||0,u=NM[k][1];
  const col=k==='pro'?'var(--pro)':k==='carb'?'var(--carb)':k==='fat'||k==='sfat'?'var(--fat)':k==='fib'?'var(--fib)':'var(--acc)';
  const v=x=>`${fmt(x,k)} ${u}`,pct=x=>tot?Math.round(x/tot*100):0;
  const row=(name,sub,x)=>`<div class="bd-row"><div class="bd-top"><span class="bd-n">${esc(name)}${sub?`<small>${esc(sub)}</small>`:''}</span><b>${v(x)}</b><span class="bd-p">${pct(x)}%</span></div><div class="track"><div class="fill" style="width:${tot?x/tot*100:0}%;background:${col}"></div></div></div>`;
  const bySlot=SLOTS.map(([s,l])=>[l,es.filter(e=>e.slot===s).reduce((a,e)=>a+(+e.n[k]||0),0),es.filter(e=>e.slot===s).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const byFood=es.map(e=>[e.name,slotName(e.slot)+' · '+qtyStr(e.qty,e.unit),+e.n[k]||0]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
  const empty=SLOTS.filter(([s])=>!bySlot.some(x=>x[0]===slotName(s))).map(x=>x[1]);
  openSheet(`<div class="sheet-h"><b>${NM[k][0]} · ${prettyDate(U.date)}</b><button class="iconbtn" data-act="close">${svg(I.x)}</button></div>
    <div class="bd-head"><b style="color:${col}">${v(tot)}</b><span>${tg?`of ${v(tg)} ${LIMITS.has(k)?'limit':'target'} · ${Math.round(tot/tg*100)}%`:''}</span></div>
    ${tot?`<div class="sec">By meal</div>${bySlot.map(x=>row(x[0],x[2]+' item'+(x[2]===1?'':'s'),x[1])).join('')}
      ${empty.length?`<div class="hint">Nothing from ${empty.join(', ')}.</div>`:''}
      <div class="sec">By food</div>${byFood.slice(0,20).map(x=>row(x[0],x[1],x[2])).join('')}${byFood.length>20?`<div class="hint">+${byFood.length-20} smaller items</div>`:''}`
    :`<div class="empty">No ${NM[k][0].toLowerCase()} logged ${U.date===today()?'today':'on this day'} yet.</div>`}
    <div class="chips" style="margin-top:14px">${['kcal','pro','carb','fat','fib'].filter(x=>x!==k).map(x=>`<button class="chip" data-act="macro" data-k="${x}" data-swap="1">${NM[x][0]}</button>`).join('')}</div>`);
}

  caddmeal:()=>{const sh=top();const ms=Object.values(S.meals).filter(m=>!m.deleted);openSheet(`<div class="sheet-h"><b>Pick a meal</b><button class="iconbtn" data-act="close">${svg(I.x)}</button></div><div class="list">${ms.map(m=>`<div class="row" data-act="cpickmeal" data-id="${m.id}"><div class="nm">${esc(m.name)}</div></div>`).join('')}</div>`,{target:sh})},
  cpickmeal:d=>{const t=top()._o.target;S.meals[d.id].items.forEach(i=>t._o.st.items.push({...i}));closeSheet();t._o.draw()},
  cedit:d=>{const sh=top(),i=+d.i,it=sh._o.st.items[i];openItem({item:it,mode:'pick',onPick:n=>{sh._o.st.items[i]=n;sh._o.draw()},closeN:1})},
  crm:d=>{const sh=top();sh._o.st.items.splice(+d.i,1);sh._o.draw()},
  csave:()=>{const sh=top(),o=sh._o,name=$('#cn',sh).value.trim();
    if(!name){toast('Give it a name');return}if(!o.st.items.length){toast('Add at least one item');return}
    const rec=o.rec||{id:uid(o.kind==='rule'?'r':'m'),deleted:false};
    Object.assign(rec,{name,slot:$('#cs',sh).value,items:o.st.items});
    if(o.kind==='rule'){if(!o.st.days.length){toast('Pick at least one day');return}Object.assign(rec,{time:$('#ct',sh).value||'07:00',days:o.st.days,active:$('#cact',sh).checked});if(!rec.startDate)rec.startDate=today()}
    put(o.kind,rec);closeSheet();render();if(o.kind==='rule')checkSchedule(true);toast('Saved')},
  cdel:()=>{const o=top()._o;remove(o.kind,o.rec);closeSheet();render();toast('Deleted')},
  review:()=>checkSchedule(true),
  aiTest:async()=>{const box=$('#aitest'),b=$('[data-act=aiTest]');if(!box)return;b.disabled=true;box.innerHTML='<div class="spinner"></div><div class="hint" style="text-align:center">Asking each provider… this can take up to a minute</div>';
    try{const j=await api({action:'aiTest'});
      box.innerHTML=`<table class="micro" style="margin-top:10px">${j.results.map(r=>`<tr><td><b>${esc(AI_NAMES[r.provider]||r.provider)}</b>${r.model?`<br><small style="color:var(--mute)">${esc(r.model)}</small>`:''}</td><td style="text-align:right">${!r.configured?'<span class="badge">no key</span>':r.ok&&r.vision!==false?`<span class="badge ok">reads photos · ${(r.ms/1000).toFixed(1)}s</span>`:r.ok?'<span class="badge">text only</span>':'<span class="badge low">failing</span>'}</td></tr>${r.configured&&r.error?`<tr><td colspan="2"><small style="color:var(--mute)">${esc(r.error)}</small></td></tr>`:''}`).join('')}</table>
        <div class="hint">Order in use: ${esc((j.chain||[]).map(p=>AI_NAMES[p]||p).join(' → ')||'none')}</div>`}
    catch(e){box.innerHTML=`<div class="empty" style="color:var(--bad)">${esc(e.message)}</div>`}
    b.disabled=false},
  macro:d=>{if(d.swap)closeSheet();openBreakdown(d.k)},
  logWeight:()=>openWeight(),
  saveWeight:()=>{const sh=top(),kg=+$('#wkg',sh).value,date=$('#wdate',sh).value||today();
    if(!(kg>20&&kg<350)){toast('Enter your weight in kg');return}
    put('weight',{id:'w_'+date,date,kg:r1(kg),name:r1(kg)+' kg',deleted:false});closeSheet();

    render();toast(profile().auto&&calcPlan(profile(),latestKg())?'Weight saved · targets updated':'Weight saved')},
  weightHistory:()=>{const wl=weightList().slice().reverse();openSheet(`<div class="sheet-h"><b>Weight history</b><button class="iconbtn" data-act="close">${svg(I.x)}</button></div><div class="list">${wl.map(w=>`<div class="row"><div class="nm">${r1(w.kg)} kg<small>${esc(prettyDate(w.date))}</small></div><button class="iconbtn" data-act="delWeight" data-id="${w.id}" aria-label="Delete">${svg(I.x)}</button></div>`).join('')}</div>`)},
  delWeight:d=>{const w=S.weights[d.id];if(w){remove('weight',w);closeSheet();render();toast('Deleted')}},
  applyPlan:()=>{if(applyPlan())render()},
  resetSplit:()=>{S.settings.mealSplit={...DEF_SPLIT};put('settings',S.settings);drawSplit()},
  copyWidget:()=>{
    if(!WIDGET_SRC){loadWidgetSrc();toast('Loading the widget script, tap again in a second');return}

    try{navigator.clipboard.writeText(code).then(()=>toast('Widget script copied. Paste it into Scriptable.'),fallback)}catch(e){fallback()}},
  profiles:()=>openProfiles(),

  padd2:async()=>{const sh=top(),name=$('#pname',sh).value.trim(),role=$('#prole',sh).value;
    if(!name){toast('Enter a name');return}
    try{const j=await api({action:'userCreate',name,role});closeSheet();showLink(j.user.name,j.token,true);}
    catch(e){toast(e.message)}},
  preset:async d=>{try{const j=await api({action:'userUpdate',id:d.id,resetToken:true});closeSheet();showLink(d.name,j.token,false)}catch(e){toast(e.message)}},
  ptoggle:async d=>{try{await api({action:'userUpdate',id:d.id,active:d.active!=='true'});toast(d.active==='true'?'Profile disabled':'Profile enabled');closeSheet();openProfiles()}catch(e){toast(e.message)}},
  prole:async d=>{try{await api({action:'userUpdate',id:d.id,role:d.role});toast('Role updated');closeSheet();openProfiles()}catch(e){toast(e.message)}},
  prename:async d=>{const sh=top(),v=$('#rn_'+d.id,sh).value.trim();if(!v)return;try{await api({action:'userUpdate',id:d.id,name:v});if(S.me&&S.me.id===d.id){S.me.name=v;save()}toast('Renamed');closeSheet();openProfiles()}catch(e){toast(e.message)}},
  pmenu:d=>{const u=JSON.parse(d.u);openSheet(`<div class="sheet-h"><b>${esc(u.name)}</b><button class="iconbtn" data-act="close">${svg(I.x)}</button></div>
    <div class="hint">${u.role==='admin'?'Admin':'User'}${u.active?'':' · disabled'}${u.main?' · main admin (you)':''}</div>
    <button class="btn" data-act="pview" data-id="${esc(u.id)}" data-name="${esc(u.name)}">${svg(I.today)} View their log</button>
    <label class="f">Name</label><div class="qty"><input id="rn_${esc(u.id)}" value="${esc(u.name)}"><button class="chip" style="height:44px" data-act="prename" data-id="${esc(u.id)}">Save</button></div>
    ${u.main?'':`<button class="btn ghost" data-act="preset" data-id="${esc(u.id)}" data-name="${esc(u.name)}">New setup link (old one stops working)</button>
    <button class="btn ghost" data-act="prole" data-id="${esc(u.id)}" data-role="${u.role==='admin'?'user':'admin'}">${u.role==='admin'?'Remove admin rights':'Make admin'}</button>
    <button class="btn danger" data-act="ptoggle" data-id="${esc(u.id)}" data-active="${u.active}">${u.active?'Disable profile':'Enable profile'}</button>`}`)},
  pcopy:async()=>{const t=$('#plink',top());try{await navigator.clipboard.writeText(t.value);toast('Link copied')}catch(e){t.select();toast('Select and copy the link')}},
  pshare:async()=>{const t=$('#plink',top());try{await navigator.share({title:'TrackMyFood setup link',text:'Open TrackMyFood, add it to your home screen, then paste this link into the Connect card:',url:t.value})}catch(e){}},
  cfgconnect:async()=>{const v=($('#cfgpaste')||{}).value;
    if(!applyCfg(v)){toast('That does not look like your setup link');return}
    toast('Connecting…');render();
    try{const pj=await api({action:'ping'});if(pj.me){S.me=pj.me;save();render()}toast(pj.me?'Connected as '+pj.me.name:'Connected to your Google Sheet');syncNow(true).then(render)}
    catch(e){toast(e.message)}},
  pok:d=>{decide(S.rules[d.id],d.d,true);toast('Added');afterDecide()},
  pskip:d=>{decide(S.rules[d.id],d.d,false);afterDecide()},
  pall:()=>{pendingList().forEach(p=>decide(p.r,p.d,true));toast('Added');afterDecide()},
  plater:()=>{snoozeUntil=Date.now()+30*60000;closeSheet();render()},
  slog:d=>{const r=S.rules[d.id],t=today();
    if(schState(r,t)==='logged'){decide(r,t,false);toast('Removed from today')}
    else{decide(r,t,true);toast(`${r.name} logged to ${slotName(r.slot)}`)}
    render();checkSchedule()},
  ruleFromMeal:()=>{const ms=Object.values(S.meals).filter(m=>!m.deleted);openSheet(`<div class="sheet-h"><b>Pick a meal to schedule</b><button class="iconbtn" data-act="close">${svg(I.x)}</button></div><div class="list">${ms.map(m=>`<div class="row" data-act="mrule" data-id="${m.id}"><div class="nm">${esc(m.name)}<small>${esc(m.items.map(i=>i.name).join(', '))}</small></div></div>`).join('')}</div>`)},
  newFood:()=>openCustomFood(null),
  editFood:d=>openCustomFood(S.foods[d.id]),
  cfsave:()=>{const sh=top(),name=$('#cfn',sh).value.trim(),g=+$('#cfg',sh).value||0;if(!name||!g){toast('Add a name and serving size, or tap Fill nutrition with AI');return}
    const n={};$$('[data-n]',sh).forEach(i=>n[i.dataset.n]=(+i.value||0)*100/g);
    const rec=sh._o.rec||{id:'my:'+uid('f'),deleted:false};Object.assign(rec,{name,n,units:[[$('#cfu',sh).value.trim()||'serving',g],['g',1]]});put('food',rec);closeSheet();render();toast('Food saved')},
  cfdel:()=>{remove('food',top()._o.rec);closeSheet();render()},
  panalyse:async()=>{const sh=top(),ctx=sh._o.photo,hint=$('#phint',sh).value.trim();
    $('#pbody',sh).innerHTML=`<div class="spinner"></div><div class="hint" style="text-align:center">Reading your plate…</div>`;
    try{const r=await analysePhoto(ctx.dataUrl,hint);ctx.items=r.items;ctx.notes=r.notes;drawReview(sh)}
    catch(e){$('#pbody',sh).innerHTML=`<div class="empty" style="color:var(--bad)">${esc(e.message)}</div><label class="f">Hint (optional)</label><input id="phint" value="${esc(hint)}"><button class="btn" data-act="panalyse">Try again</button><button class="btn ghost" data-act="pmanual">Add items manually</button>`}},
  pmanual:()=>{drawReview(top())},
  prm:d=>{const sh=top();sh._o.photo.items.splice(+d.i,1);drawReview(sh)},
  padd:()=>{const sh=top();openSearch({onPick:it=>{sh._o.photo.items.push({...it,src:'db',conf:'high',aiUnits:unitsFor(it)});drawReview(sh)}})},
  plog:()=>{const sh=top(),ctx=sh._o.photo,mode=ctx.mode||'log';
    let items=ctx.items.filter(i=>i.grams>0).map(i=>({name:i.name,foodId:i.foodId,qty:i.qty,unit:i.unit,grams:i.grams,p100:i.p100}));
    if(!items.length){toast('Nothing to save');return}
    if(mode==='pick'){ctx.onPick(items);closeSheet();return}
    const name=(($('#pname2',sh)||{}).value||'').trim()||'My meal';
    const combine=$('#pcombine',sh).checked,saveMeal=$('#psave',sh).checked,saveFood=$('#pfood',sh).checked;
    const totG=items.reduce((a,i)=>a+i.grams,0),tot=sumN(items.map(i=>({n:scaleN(i.p100,i.grams)})));
    const p100c=Object.fromEntries(NK.map(k=>[k,tot[k]*100/totG]));
    let food=null;
    if(saveFood){const sv=Math.max(0.5,+$('#pservn',sh).value||1),sn=$('#pserv',sh).value.trim()||'serving';
      food={id:'my:'+uid('f'),name,n:p100c,units:[[sn,Math.round(totG/sv*10)/10],['g',1]],deleted:false,src:'ai'};put('food',food)}
    const one=food?{name,foodId:food.id,qty:1,unit:food.units[0][0],grams:food.units[0][1],p100:p100c}
                  :{name,foodId:'',qty:1,unit:'serving',grams:Math.round(totG),p100:p100c};
    const mealItems=combine||food&&combine?[one]:items;
    if(saveMeal)put('meal',{id:uid('m'),name,slot:mode==='log'?$('#pslot',sh).value:ctx.slot,items:mealItems.map(i=>({...i})),deleted:false});
    if(mode==='log'){const slot=$('#pslot',sh).value,date=$('#pdate',sh).value||ctx.date;
      (combine?[food?one:{...one}]:items).forEach(it=>{const e=makeEntry(it,date,slot,ctx.dataUrl?'photo':'ai');e.createdAt=Date.now();put('entry',e,true)});save();scheduleSync();
      closeAll();U.date=date;U.tab='today';render();toast(combine?`${name} logged`:`Logged ${items.length} item${items.length===1?'':'s'}`);return}
    closeAll();U.tab='meals';render();toast(saveMeal&&food?'Saved to My Meals and My foods':saveMeal?'Saved to My Meals':food?'Saved to My foods':'Nothing saved: tick an option')},
  danalyse:async()=>{const sh=top(),ctx=sh._o.photo,t=$('#dtext',sh);const text=(t?t.value:ctx.text).trim();
    if(!text){toast('Describe the food first');return}
    ctx.text=text;$('#pbody',sh).innerHTML=`<div class="spinner"></div><div class="hint" style="text-align:center">Working out the nutrients…</div>`;
    try{const r=await analyseText(text);Object.assign(ctx,{items:r.items,notes:r.notes,title:r.title,serving:r.serving});drawReview(sh)}
    catch(e){$('#pbody',sh).innerHTML=`<div class="empty" style="color:var(--bad)">${esc(e.message)}</div><textarea id="dtext" rows="4">${esc(text)}</textarea><button class="btn" data-act="danalyse">Try again</button>`}},
  predo:()=>{const sh=top(),ctx=sh._o.photo;$('#pbody',sh).innerHTML=`<textarea id="dtext" rows="5">${esc(ctx.text||'')}</textarea><button class="btn" data-act="danalyse">${svg(I.spark)} Recalculate</button>`},
  aiDescribe:d=>{const o=top()&&top()._o;const q=d.q||'';if(d.close)closeSheet();openDescribe({mode:'log',slot:d.slot||(o&&o.slot)||nowSlot(),date:U.date,text:q})},
  aiMeal:()=>openDescribe({mode:'meal'}),
  caddai:()=>{const sh=top();openDescribe({mode:'pick',onPick:items=>{items.forEach(i=>sh._o.st.items.push(i));sh._o.draw()}})},
  cfai:async()=>{const sh=top(),name=$('#cfn',sh).value.trim(),sv=$('#cfu',sh).value.trim(),g=+$('#cfg',sh).value||0;
    if(!name){toast('Type the food name first, e.g. Whole Truth whey 1 scoop');return}
    const b=$('[data-act=cfai]',sh);b.disabled=true;b.innerHTML=svg(I.spark)+' Estimating…';
    try{const o=parseJSON(await aiCall(foodPrompt(name,sv==='serving'?'':sv,g),''));
      if(o.serving_name)$('#cfu',sh).value=o.serving_name;
      const sg=+o.serving_grams||g||100;$('#cfg',sh).value=r1(sg);
      const ps=cleanN(o.per_serving);$$('[data-n]',sh).forEach(i=>i.value=r1(ps[i.dataset.n]));
      $('#cfnote',sh).innerHTML=`<span class="badge ai">AI estimate</span>${o.confidence==='low'?'<span class="badge low">check</span>':''} ${esc(o.notes||'')} Compare with the label if you have it.`;
    }catch(e){toast(e.message)}
    b.disabled=false;b.innerHTML=svg(I.spark)+' Fill nutrition with AI'},
  testSheets:async()=>{const m=$('#sheetmsg');m.textContent='Testing…';try{const pj=await api({action:'ping'});if(pj.me){S.me=pj.me;save();render()}m.textContent='Connected to Google Sheets ✓';syncNow(true)}catch(e){m.textContent=e.message}},
  syncAll:async()=>{await syncNow(true);const m=$('#sheetmsg');if(m)m.textContent=U.sync==='ok'?'Synced '+new Date().toLocaleTimeString():U.syncMsg},
  export:()=>{const data=JSON.stringify({entries:S.entries,meals:S.meals,rules:S.rules,foods:S.foods,settings:S.settings},null,1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`trackmyfood-${today()}.json`;document.body.appendChild(a);a.click();a.remove()},
  import:()=>{const i=$('#importIn');i.value='';i.click()},
  wipe:()=>{openSheet(`<div class="sheet-h"><b>Erase data on this device?</b></div><div class="hint">Your Google Sheet is not touched. Data synced there comes back with "Sync now".</div><button class="btn" style="background:var(--bad)" data-act="wipeYes">Erase</button><button class="btn ghost" data-act="close">Cancel</button>`)},
  wipeYes:()=>{const cfg=S.cfg;S=defaultState();S.cfg=cfg;save();closeAll();render();toast('Erased')},
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=A[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a,e)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.prof!==undefined&&el.type!=='checkbox'&&el.tagName==='INPUT'){setProf(el.dataset.prof,el.value);return}
  if(el.dataset.ht){const r=el.closest('.grid3'),f=+$('[data-ht=ft]',r).value||0,i=+$('[data-ht=in]',r).value||0;if(f||i){const cm=Math.round((f*12+i)*2.54);$('[data-prof=heightCm]',r).value=cm;setProf('heightCm',cm)}return}
  if(el.dataset.split){S.settings.mealSplit={...mealSplit(),[el.dataset.split]:Math.max(0,+el.value||0)};clearTimeout(el._t);el._t=setTimeout(()=>put('settings',S.settings),800);drawSplit();return}
  if(el.dataset.target){S.settings.targets[el.dataset.target]=+el.value||0;clearTimeout(el._t);el._t=setTimeout(()=>put('settings',S.settings),800);return}
  const rev=el.closest('.rev');
  if(rev){const sh=top(),it=sh._o.photo.items[+rev.dataset.i],f=el.dataset.f;
    if(f==='name')it.name=el.value;
    else{it.qty=+$('[data-f=qty]',rev).value||0;it.unit=$('[data-f=unit]',rev).value;const units=it.foodId?(foodById(it.foodId)||{}).units||it.aiUnits:it.aiUnits;const u=units.find(u=>u[0]===it.unit)||['g',1];it.grams=it.qty*u[1];
      $('[data-f=kc]',rev).textContent=Math.round(it.p100.kcal*it.grams/100)+' kcal';$('[data-f=mac]',rev).textContent=`P ${r1(it.p100.pro*it.grams/100)} · C ${r1(it.p100.carb*it.grams/100)} · F ${r1(it.p100.fat*it.grams/100)}`;drawPTot(sh)}}
});
function setProf(k,v){
  const p={...profile(),[k]:k==='auto'?!!v:(k==='sex'||k==='goal')?v:(v===''?'':+v)};
  S.settings.profile=p;clearTimeout(setProf._t);setProf._t=setTimeout(()=>put('settings',S.settings),800);
  if(k==='heightCm'){const r=$('[data-ht=ft]');if(r&&document.activeElement&&!document.activeElement.dataset.ht){const cm=+v||0;$('[data-ht=ft]').value=cm?Math.floor(cm/30.48):'';$('[data-ht=in]').value=cm?Math.round((cm/2.54)%12):''}}
  drawPlan();
}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.prof!==undefined&&(el.tagName==='SELECT'||el.type==='checkbox')){setProf(el.dataset.prof,el.type==='checkbox'?el.checked:el.value);return}
  if(el.dataset.cfg){S.cfg[el.dataset.cfg]=el.value.trim();save();if(el.dataset.cfg==='aiMode'||el.dataset.cfg==='scriptUrl')render()}
  if(el.closest('.rev')&&el.tagName==='SELECT')el.dispatchEvent(new Event('input',{bubbles:true}));
});
$('#camIn').onchange=e=>onPhotoFile(e.target.files[0]);
$('#upIn').onchange=e=>onPhotoFile(e.target.files[0]);
$('#importIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());
  ['entries','meals','rules','foods'].forEach(c=>Object.values(j[c]||{}).forEach(r=>{const kind=Object.keys(COLL).find(k=>COLL[k]===c);put(kind,r,true)}));
  if(j.settings){S.settings=j.settings;S.settings.targets={...DEF_T,...S.settings.targets};put('settings',S.settings,true)}
  save();scheduleSync();render();toast('Backup imported')}catch(err){toast('That file is not a TrackMyFood backup')}};

/* ---------- boot ---------- */
// One-time setup link: index.html#cfg=<base64 {"u":scriptUrl,"t":token}> stores the config and clears the hash.
if(location.hash.startsWith('#cfg=')){
  if(applyCfg(location.hash))setTimeout(()=>{toast('Connected to your Google Sheet');syncNow(true)},300);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}
function afterDecide(){const sh=stack.length?top():null;if(sh&&sh._o.prompt)drawPrompt(sh);render()}
window.addEventListener('popstate',()=>{if(stack.length){closeAll();return}if(U.sub){U.sub=null;render();scrollTo(0,0)}});
render();checkSchedule(true);loadWidgetSrc();
if(S.cfg.scriptUrl)syncNow(true).then(()=>checkSchedule());
setInterval(()=>checkSchedule(),60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){snoozeUntil=0;checkSchedule(true);if(S.cfg.scriptUrl)syncNow(true).then(()=>checkSchedule())}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
